# Brain-age regression (trained on CN subjects only)
seed: 42
paths:
  cohort_table: data/tables/cn_cohort.csv
  splits: data/tables/cn_splits.csv
  train_scans: data/tables/cn_train_scans.csv     # all CN training visits (decision 18)
  scan_qc: data/tables/scan_qc_final.csv          # val/test and MCI baseline scans
  mci_cohort_table: data/tables/mci_cohort.csv
  freesurfer_table: data/raw/tables/UCSFFSX7_13Nov2026.csv
  preprocessing_config: configs/preprocessing.yaml
  features_dir: data/features                     # local only
  out_dir: outputs/brain_age
features:                  # src/brain_age/extract_features.py (decision 22)
  downsample_factor: 4     # 1 mm -> 4 mm by block averaging
  mask_min_fraction: 0.5   # 4 mm block is brain if >= half its voxels are in the template mask
baseline:
  model: svr               # svr or ridge
  features: voxels_4mm     # PCA fitted on training folds only, inside the pipeline
  train_scans: all         # all CN training visits; CV folds grouped by subject
  cv_folds: 5
  grid:                    # src/brain_age/train_baseline.py; chosen by CV MAE on train
    # 1200 is close to the limit (about 1,350 scans in the smallest training fold); run 1 with
    # max 800 still improved at 800, so the grid was extended (experiment_log.md)
    pca_components: [25, 50, 100, 200, 400, 800, 1200]
    ridge:
      alpha: [1.0e+1, 1.0e+2, 1.0e+3, 1.0e+4, 1.0e+5, 1.0e+6]
    svr:                   # RBF kernel, gamma = "scale"
      C: [0.3, 1, 10, 100, 1000]
      epsilon: [0.5, 2.0]
cnn:
  input_downsample_mm: 2.0   # 2 x 2 x 2 block mean -> 80 x 96 x 80 (src/brain_age/data.py)
  augment_max_shift: 2       # training only: random shift up to 2 voxels + left-right flip
  cache_dir: null            # e.g. a folder on a large disk: 2 mm arrays saved once (~6 GB)
  dropout: 0.5               # src/brain_age/cnn.py, before the last layer
  weight_decay: 0.0001       # AdamW
  lr_patience: 5             # halve lr after this many epochs without val improvement
  batch_size: 4
  epochs: 100
  lr: 0.0001
  loss: l1
  early_stopping_patience: 15
bias_correction:
  enabled: true
  fit_on: train            # never val or test
metrics: [mae, rmse, pearson_r]
