# E2: MRI-derived features + chronological age
experiment: E2
seed: 42
paths:
  cohort_table: data/tables/mci_cohort.csv
  splits: data/tables/mci_splits.csv
  features: data/features/mci_voxels_4mm.npy        # src/features/mci_features.py (decision 33)
  features_index: data/features/mci_voxels_4mm_index.csv
  out_dir: outputs/progression/E2
inputs:
  mri_features: true
  age: true
  bag: false
  clinical: false
models: [logistic_regression, random_forest]
cv_folds: 5                # stratified by label, seed 42; identical folds in E1 and E2
selection_metric: roc_auc  # mean CV ROC-AUC on MCI train (decision 33)
grid:                      # src/progression/train.py; same grid in E1 and E2
  # smallest CV training part is about 252 subjects, so 200 components is near the limit
  pca_components: [10, 20, 50, 100, 200]
  logistic_regression:     # L2, balanced class weights; inputs standardised
    C: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0, 10.0]
  random_forest:           # balanced class weights
    n_estimators: 500
    min_samples_leaf: [1, 5, 10]
    max_features: [sqrt, 0.3]
metrics: [roc_auc, pr_auc, sensitivity, specificity, precision, f1]
bootstrap_iterations: 1000
# Must stay identical to e1.yaml except: experiment, out_dir, inputs.age
